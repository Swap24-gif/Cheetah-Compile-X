<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cheetah Compile X — Python · C · JavaScript</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg:rgba(6,8,10,.4);
    --panel:rgba(18,21,26,.66);
    --panel-alt:rgba(24,28,34,.66);
    --border:#262b33;
    --border-soft:#1e222a;
    --text:#e6e8ec;
    --text-dim:#8a909b;
    --text-faint:#4d525c;
    --accent:#5b8cff;
    --accent-dim:#33437a;
    --amber:#f2a93c;
    --success:#3ddc97;
    --error:#ff6470;
    --py-a:#4b8bbe;
    --py-b:#ffd43b;
    --c-col:#a8b2c2;
    --js-col:#f2c94c;
    --sql-col:#ef8354;
  }

  *{margin:0;padding:0;box-sizing:border-box;cursor:none !important;}
  html,body{height:100%;}
  body{
    background:#020302;
    color:var(--text);
    font-family:'IBM Plex Sans',sans-serif;
    height:100vh;
    overflow:hidden;
    display:flex;
    padding:14px;
  }

  #bgCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:-1;display:block;pointer-events:none;}

  .cursor-dot{
    position:fixed;top:0;left:0;
    width:14px;height:14px;
    border-radius:50%;
    border:2px solid var(--accent);
    background:rgba(255,255,255,.06);
    box-shadow:0 0 8px var(--accent), 0 0 18px var(--accent-dim);
    pointer-events:none;
    z-index:9999;
    transform:translate(-50%,-50%);
    transition:width .15s, height .15s, box-shadow .2s, border-color .2s, background .15s;
  }
  .cursor-dot.hover{
    width:24px;height:24px;
    background:rgba(255,255,255,.1);
    box-shadow:0 0 14px var(--accent), 0 0 34px var(--accent-dim);
  }
  .cursor-dot.press{
    width:9px;height:9px;
    background:var(--accent);
    box-shadow:0 0 16px var(--accent), 0 0 30px var(--accent);
  }
  .cursor-dot.text{
    width:3px;height:20px;border-radius:2px;
    border:none;background:var(--accent);
    box-shadow:0 0 8px var(--accent), 0 0 18px var(--accent-dim);
  }

  .app-shell{
    flex:1;min-width:0;min-height:0;
    display:flex;flex-direction:column;
    position:relative;
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.65);
  }
  .brackets{position:absolute;inset:0;pointer-events:none;z-index:6;}
  .brackets span{position:absolute;width:16px;height:16px;border-color:var(--accent);opacity:.75;filter:drop-shadow(0 0 6px var(--accent-dim));transition:border-color .3s, filter .3s;}
  .brackets .tl{top:8px;left:8px;border-top:2px solid;border-left:2px solid;}
  .brackets .tr{top:8px;right:8px;border-top:2px solid;border-right:2px solid;}
  .brackets .bl{bottom:8px;left:8px;border-bottom:2px solid;border-left:2px solid;}
  .brackets .brc{bottom:8px;right:8px;border-bottom:2px solid;border-right:2px solid;}

  /* ---------- Header ---------- */
  .header{
    display:flex;flex-direction:column;gap:10px;
    padding:12px 20px;
    background:var(--panel);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .header-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .header-right{display:flex;align-items:center;gap:14px;margin-left:auto;}
  .brand{display:flex;align-items:baseline;gap:8px;}
  .brand-mark{
    width:9px;height:9px;border-radius:2px;
    background:var(--accent);
    transform:rotate(45deg);
    flex-shrink:0;
  }
  .brand-name{font-size:16px;font-weight:600;letter-spacing:0.2px;}
  .brand-sub{font-size:11px;color:var(--text-faint);font-family:'IBM Plex Mono',monospace;}

  .lang-select{display:flex;gap:6px;}
  .lang-pill{
    display:flex;align-items:center;gap:8px;
    padding:7px 14px 7px 10px;
    background:var(--panel-alt);
    border:1px solid var(--border);
    border-radius:6px;
    cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .lang-pill:hover{border-color:var(--accent);box-shadow:0 0 14px var(--accent-dim), 0 0 2px var(--accent);}
  .lang-pill.active{background:rgba(28,33,41,.85);border-color:var(--accent);box-shadow:0 0 10px var(--accent-dim);}
  .lang-dot{
    display:flex;align-items:center;justify-content:center;
    padding:2px 5px;border-radius:4px;
    font-size:9.5px;font-weight:700;line-height:1.3;
    font-family:'IBM Plex Mono',monospace;letter-spacing:.2px;
    flex-shrink:0;
  }
  .lang-dot.python{background:linear-gradient(115deg,var(--py-a) 48%,var(--py-b) 52%);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.35);}
  .lang-dot.c{background:#3f7fbf;color:#f4f8ff;}
  .lang-dot.javascript{background:var(--js-col);color:#1a1a12;}
  .lang-dot.sql{background:var(--sql-col);color:#241008;}
  .lang-name{font-size:13px;font-weight:500;}
  .lang-pill.active .lang-name{color:var(--text);}
  .lang-pill:not(.active) .lang-name{color:var(--text-dim);}

  .theme-select{display:flex;align-items:center;gap:7px;padding:0 4px;}
  .theme-dot{
    width:15px;height:15px;border-radius:4px;
    cursor:pointer;border:2px solid transparent;
    box-shadow:0 0 0 1px var(--border) inset;
    transition:transform .15s, box-shadow .15s, filter .15s;
  }
  .theme-dot:hover{transform:scale(1.2);filter:brightness(1.25);box-shadow:0 0 10px 2px currentColor, 0 0 0 1px var(--border) inset;}
  .theme-dot.active{box-shadow:0 0 0 2px var(--bg), 0 0 10px 2px currentColor;}

  .shortcuts-btn{
    font-size:12px;color:var(--text-faint);
    border:1px solid var(--border);
    padding:6px 12px;border-radius:6px;
    cursor:pointer;font-family:'IBM Plex Mono',monospace;
    transition:color .15s, border-color .15s;
  }
  .shortcuts-btn:hover{color:var(--accent);border-color:var(--accent);box-shadow:0 0 12px var(--accent-dim);}

  /* ---------- Main split ---------- */
  .main{display:flex;flex:1;overflow:hidden;}
  .editor-side, .output-side{display:flex;flex-direction:column;flex:1;min-width:0;}
  .editor-side{border-right:1px solid var(--border);}

  .panel-header{
    display:flex;align-items:center;gap:10px;
    padding:9px 16px;
    background:var(--panel);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    border-bottom:1px solid var(--border-soft);
    flex-shrink:0;
    font-size:12px;
  }
  .panel-label{color:var(--text-dim);font-weight:500;}
  .panel-meta{margin-left:auto;color:var(--text-faint);font-family:'IBM Plex Mono',monospace;font-size:11px;}

  .editor-wrap{flex:1;overflow:hidden;position:relative;}
  .CodeMirror{
    height:100%;
    background:var(--bg) !important;
    backdrop-filter:blur(3px);
    -webkit-backdrop-filter:blur(3px);
    color:var(--text) !important;
    font-family:'IBM Plex Mono',monospace !important;
    font-size:13.5px;
    line-height:1.65;
    padding-top:4px;
    text-shadow:0 1px 4px rgba(0,0,0,.85);
  }
  .CodeMirror-gutters{background:rgba(6,8,10,.55) !important;border-right:1px solid var(--border-soft) !important;backdrop-filter:blur(3px);}
  .CodeMirror-linenumber{color:var(--text-faint) !important;font-size:12px;}
  .CodeMirror-cursor{
    border-left:3px solid var(--accent) !important;
    box-shadow:0 0 6px var(--accent), 0 0 16px var(--accent), 0 0 26px var(--accent-dim) !important;
    animation:cursorGlow 1.1s ease-in-out infinite alternate;
  }
  @keyframes cursorGlow{
    from{box-shadow:0 0 6px var(--accent), 0 0 12px var(--accent);}
    to{box-shadow:0 0 14px var(--accent), 0 0 30px var(--accent), 0 0 46px var(--accent-dim);}
  }
  .CodeMirror-selected{background:var(--accent-dim) !important;}
  .cm-comment{color:#5c6370 !important;}
  .cm-keyword{color:#c792ea !important;}
  .cm-string,.cm-string-2{color:#7fd88f !important;}
  .cm-number{color:var(--amber) !important;}
  .cm-def{color:#61afef !important;}
  .cm-variable,.cm-property{color:var(--text) !important;}
  .cm-atom{color:var(--amber) !important;}
  .cm-operator{color:#89ddff !important;}
  .cm-meta{color:#5b8cff !important;}

  /* ---------- Output ---------- */
  .output-tabs{display:flex;background:var(--panel);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-bottom:1px solid var(--border);flex-shrink:0;}
  .tab{
    padding:9px 16px;font-size:12px;font-weight:500;
    cursor:pointer;color:var(--text-faint);
    border-bottom:2px solid transparent;
    transition:color .15s, text-shadow .15s;
  }
  .tab.active{color:var(--text);border-bottom-color:var(--accent);text-shadow:0 0 10px var(--accent-dim);}
  .tab:hover:not(.active){color:var(--text-dim);text-shadow:0 0 8px var(--accent-dim);}

  #output{
    flex:1;overflow-y:auto;
    padding:16px;
    background:var(--bg);
    backdrop-filter:blur(3px);
    -webkit-backdrop-filter:blur(3px);
    text-shadow:0 1px 4px rgba(0,0,0,.85);
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;line-height:1.75;
    white-space:pre-wrap;
    word-break:break-word;
  }
  #output::-webkit-scrollbar{width:8px;}
  #output::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

  .line{margin-bottom:2px;}
  .sep{color:var(--border);user-select:none;}
  .hd{color:var(--accent);}
  .ok{color:var(--success);}
  .err{color:var(--error);}
  .warn{color:var(--amber);}
  .dim{color:var(--text-dim);}
  .stamp{color:var(--text-faint);}
  .ai-verdict{color:var(--amber);font-weight:600;}
  .ai-bugs{color:var(--error);font-weight:600;}
  .ai-perf{color:var(--accent);font-weight:600;}
  .ai-style{color:var(--success);font-weight:600;}
  .ai-suggest{color:#c792ea;font-weight:600;}
  .thinking{color:var(--text-dim);}
  .thinking::after{content:'';animation:dots 1.2s steps(4,end) infinite;}
  @keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}100%{content:''}}

  /* ---------- Action controls (now in header) ---------- */
  .run-btn{
    display:flex;align-items:center;justify-content:center;
    width:40px;height:40px;flex-shrink:0;
    background:var(--accent);color:#0e1013;
    border:none;padding:0;
    cursor:pointer;border-radius:8px;
    box-shadow:0 0 0 rgba(0,0,0,0);
    transition:filter .15s, transform .1s, box-shadow .2s;
  }
  .run-btn:hover{filter:brightness(1.12);box-shadow:0 0 16px var(--accent), 0 0 32px var(--accent-dim);transform:translateY(-1px);}
  .run-btn:active{transform:scale(0.94);}
  .run-btn:disabled{opacity:0.5;cursor:default;box-shadow:none;transform:none;}
  .run-icon{width:0;height:0;margin-left:3px;border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:11px solid #0e1013;}

  .btn{
    background:transparent;color:var(--text-dim);
    border:1px solid var(--border);
    padding:8px 16px;font-size:12.5px;font-weight:500;
    font-family:'IBM Plex Sans',sans-serif;
    cursor:pointer;border-radius:6px;
    transition:color .15s, border-color .15s, box-shadow .2s, transform .1s;
  }
  .btn:hover{color:var(--text);border-color:var(--accent);box-shadow:0 0 12px var(--accent-dim);transform:translateY(-1px);}
  .ai-btn{color:#c792ea;border-color:#3a2f47;}
  .ai-btn:hover{color:#dab6f5;border-color:#c792ea;box-shadow:0 0 14px rgba(199,146,234,.45);}

  .status-bar{display:flex;align-items:center;gap:16px;margin-left:auto;font-size:11.5px;color:var(--text-faint);}
  .status-item{display:flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;}
  .status-dot{width:6px;height:6px;border-radius:50%;background:var(--text-faint);flex-shrink:0;}
  .status-dot.ready{background:var(--success);}
  .status-dot.running{background:var(--amber);animation:pulse .6s infinite alternate;}
  .status-dot.error{background:var(--error);}
  @keyframes pulse{from{opacity:1}to{opacity:.35}}

  /* ---------- Modal ---------- */
  .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center;}
  .modal.open{display:flex;}
  .modal-box{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border);padding:24px;max-width:380px;width:90%;border-radius:8px;}
  .modal-title{font-size:14px;font-weight:600;margin-bottom:16px;}
  .shortcut-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border-soft);font-size:12.5px;color:var(--text-dim);}
  .key{color:var(--accent);background:var(--panel-alt);padding:3px 8px;border-radius:4px;font-size:11px;font-family:'IBM Plex Mono',monospace;}
  .close-btn{margin-top:16px;width:100%;background:transparent;color:var(--text-dim);border:1px solid var(--border);padding:9px;font-size:12.5px;cursor:pointer;border-radius:6px;font-family:'IBM Plex Sans',sans-serif;}
  .close-btn:hover{color:var(--text);border-color:var(--accent);box-shadow:0 0 12px var(--accent-dim);}

  @media (max-width:820px){
    .main{flex-direction:column;}
    .editor-side{border-right:none;border-bottom:1px solid var(--border);}
    .lang-name{display:none;}
  }
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>
<div class="cursor-dot" id="cursorDot"></div>

<div class="app-shell">
<div class="brackets"><span class="tl"></span><span class="tr"></span><span class="bl"></span><span class="brc"></span></div>

<div class="header">
  <div class="header-row">
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-name">Cheetah Compile X</span>
      <span class="brand-sub">multi-language runtime</span>
    </div>
    <div class="lang-select">
      <div class="lang-pill active" data-lang="python" onclick="setLanguage('python')">
        <span class="lang-dot python">Py</span><span class="lang-name">Python</span>
      </div>
      <div class="lang-pill" data-lang="c" onclick="setLanguage('c')">
        <span class="lang-dot c">C</span><span class="lang-name">C</span>
      </div>
      <div class="lang-pill" data-lang="javascript" onclick="setLanguage('javascript')">
        <span class="lang-dot javascript">JS</span><span class="lang-name">JavaScript</span>
      </div>
      <div class="lang-pill" data-lang="sql" onclick="setLanguage('sql')">
        <span class="lang-dot sql">SQL</span><span class="lang-name">SQL</span>
      </div>
    </div>
    <div class="header-right">
      <div class="theme-select" id="themeSelect" title="Theme">
        <span class="theme-dot active" data-theme="indigo" style="background:#5b8cff;color:#5b8cff" onclick="setTheme('indigo')"></span>
        <span class="theme-dot" data-theme="maroon" style="background:#c1485f;color:#c1485f" onclick="setTheme('maroon')"></span>
        <span class="theme-dot" data-theme="sky" style="background:#38a3e0;color:#38a3e0" onclick="setTheme('sky')"></span>
        <span class="theme-dot" data-theme="green" style="background:#3fbd7a;color:#3fbd7a" onclick="setTheme('green')"></span>
      </div>
      <div class="shortcuts-btn" onclick="toggleModal()">Shortcuts</div>
    </div>
  </div>
  <div class="header-row">
    <button class="run-btn" id="runBtn" onclick="runCode()" title="Run"><span class="run-icon"></span></button>
    <button class="btn ai-btn" onclick="aiReview()">AI Review</button>
    <button class="btn" onclick="resetTemplate()">Reset template</button>
    <button class="btn" onclick="clearOutput()">Clear output</button>
    <div class="status-bar">
      <span class="status-item"><span class="status-dot ready" id="statusDot"></span><span id="statusText">Ready</span></span>
      <span class="status-item" id="execTime"></span>
    </div>
  </div>
</div>

<div class="main">
  <div class="editor-side">
    <div class="panel-header">
      <span class="panel-label">Editor</span>
      <span class="panel-meta" id="fileMeta">main.py</span>
    </div>
    <div class="editor-wrap"><textarea id="code"></textarea></div>
  </div>

  <div class="output-side">
    <div class="output-tabs">
      <div class="tab active" data-tab="console" onclick="switchTab('console')">Console</div>
      <div class="tab" data-tab="ai" onclick="switchTab('ai')">AI Review</div>
      <div class="tab" data-tab="history" onclick="switchTab('history')">History</div>
    </div>
    <div id="output"></div>
  </div>
</div>

</div><!-- /app-shell -->

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-title">Keyboard shortcuts</div>
    <div class="shortcut-row"><span>Run code</span><span class="key">Ctrl + Enter</span></div>
    <div class="shortcut-row"><span>AI review</span><span class="key">Ctrl + K</span></div>
    <div class="shortcut-row"><span>Clear output</span><span class="key">Ctrl + L</span></div>
    <div class="shortcut-row"><span>Focus editor</span><span class="key">Esc</span></div>
    <button class="close-btn" onclick="toggleModal()">Close</button>
  </div>
</div>

<script>
/* ---------------- custom neon cursor ---------------- */
const cursorDot = document.getElementById('cursorDot');
let cx = innerWidth/2, cy = innerHeight/2, dx = cx, dy = cy;
document.addEventListener('mousemove', e => {
  dx = e.clientX; dy = e.clientY;
  const interactive = e.target.closest('button, .tab, .lang-pill, .theme-dot, .shortcuts-btn, .close-btn, .brand-mark');
  const textZone = e.target.closest('.CodeMirror, #output');
  cursorDot.classList.toggle('hover', !!interactive);
  cursorDot.classList.toggle('text', !interactive && !!textZone);
});
document.addEventListener('mousedown', () => cursorDot.classList.add('press'));
document.addEventListener('mouseup', () => cursorDot.classList.remove('press'));
function trackCursor(){
  cx += (dx-cx)*0.35; cy += (dy-cy)*0.35;
  cursorDot.style.left = cx+'px';
  cursorDot.style.top = cy+'px';
  requestAnimationFrame(trackCursor);
}
trackCursor();

/* ---------------- language config ---------------- */
const LANGS = {
  python: {
    mode:'python', file:'main.py', piston:'python',
    template: `def main():\n    print("Hello from Python")\n\nif __name__ == "__main__":\n    main()\n`
  },
  c: {
    mode:'text/x-csrc', file:'main.c', piston:'c',
    template: `#include <stdio.h>\n\nint main(void) {\n    printf("Hello from C\\n");\n    return 0;\n}\n`
  },
  javascript: {
    mode:'javascript', file:'main.js', piston:'javascript',
    template: `function main() {\n  console.log("Hello from JavaScript");\n}\n\nmain();\n`
  },
  sql: {
    mode:'text/x-sql', file:'main.sql', piston:'sqlite3',
    template: `CREATE TABLE users (id INTEGER PRIMARY KEY, name TEXT, role TEXT);\n\nINSERT INTO users (name, role) VALUES\n  ('Ada', 'engineer'),\n  ('Grace', 'admiral');\n\nSELECT * FROM users;\n`
  }
};

const THEMES = {
  indigo: { accent:'#5b8cff', accentDim:'#33437a',
    bgTop:'#0a0e1f', bgBottom:'#050609', fog:'80,100,160',
    camo:['#141a33','#1c2440','#0d1226','#232c52'], leaf:'#3d4a7a' },
  maroon: { accent:'#c1485f', accentDim:'#4a232d',
    bgTop:'#200a0d', bgBottom:'#080303', fog:'150,60,60',
    camo:['#3a1418','#2a0d10','#170708','#4a1c1f'], leaf:'#7a2c37' },
  sky: { accent:'#38a3e0', accentDim:'#1c3a4d',
    bgTop:'#06141f', bgBottom:'#020608', fog:'60,140,175',
    camo:['#123344','#0c2430','#081820','#1a445a'], leaf:'#1f6478' },
  green: { accent:'#3fbd7a', accentDim:'#1d3f2c',
    bgTop:'#0a1f14', bgBottom:'#040a06', fog:'75,120,55',
    camo:['#2d3b1f','#1a2b12','#0f1a0a','#3f4d24'], leaf:'#44601f' }
};
let activeTheme = 'indigo';

function setTheme(name){
  const t = THEMES[name];
  if(!t) return;
  activeTheme = name;
  document.documentElement.style.setProperty('--accent', t.accent);
  document.documentElement.style.setProperty('--accent-dim', t.accentDim);
  document.querySelectorAll('.theme-dot').forEach(d => d.classList.toggle('active', d.dataset.theme===name));
  buildCamo();
}

/* ---------------- live jungle-ops background ---------------- */
const bgCanvas = document.getElementById('bgCanvas');
const bgCtx = bgCanvas.getContext('2d');
const camoCanvas = document.createElement('canvas');
const camoCtx = camoCanvas.getContext('2d');
let W = 0, H = 0, leaves = [];
const fogBlobs = [0,1,2].map((i) => ({ phase: Math.random()*Math.PI*2, speed: 0.00035 + i*0.00012, yFrac: 0.18 + i*0.28, size: 0.55 + i*0.18 }));

function drawBlob(ctx, cx, cy, r){
  ctx.beginPath();
  const points = 9;
  for(let i=0;i<=points;i++){
    const ang = (i/points)*Math.PI*2;
    const rad = r*(0.65+Math.random()*0.55);
    const x = cx+Math.cos(ang)*rad, y=cy+Math.sin(ang)*rad;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath();
  ctx.fill();
}

function buildCamo(){
  if(!W || !H) return;
  camoCanvas.width = W; camoCanvas.height = H;
  const th = THEMES[activeTheme];
  camoCtx.clearRect(0,0,W,H);
  for(let i=0;i<22;i++){
    camoCtx.fillStyle = th.camo[i % th.camo.length];
    camoCtx.globalAlpha = 0.55;
    drawBlob(camoCtx, Math.random()*W, Math.random()*H, 70+Math.random()*180);
  }
  camoCtx.globalAlpha = 1;
}

function initLeaves(){
  leaves = Array.from({length:22}, () => ({
    x: Math.random()*W, y: Math.random()*H,
    size: 6+Math.random()*9,
    speedY: 0.25+Math.random()*0.5,
    speedX: (Math.random()-0.5)*0.35,
    rot: Math.random()*Math.PI*2,
    rotSpeed: (Math.random()-0.5)*0.02,
    sway: Math.random()*Math.PI*2
  }));
}

function resizeBg(){
  W = bgCanvas.width = innerWidth;
  H = bgCanvas.height = innerHeight;
  buildCamo();
  if(!leaves.length) initLeaves();
}
window.addEventListener('resize', resizeBg);

let frame = 0;
function animateBg(){
  frame++;
  const th = THEMES[activeTheme];

  const sky = bgCtx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0, th.bgTop);
  sky.addColorStop(1, th.bgBottom);
  bgCtx.fillStyle = sky;
  bgCtx.fillRect(0,0,W,H);

  bgCtx.globalAlpha = 0.4;
  bgCtx.drawImage(camoCanvas,0,0);
  bgCtx.globalAlpha = 1;

  fogBlobs.forEach(f => {
    const x = W*0.5 + Math.sin(frame*f.speed + f.phase)*W*0.55;
    const y = H*f.yFrac;
    const r = W*f.size;
    const g = bgCtx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0, `rgba(${th.fog},0.16)`);
    g.addColorStop(1, `rgba(${th.fog},0)`);
    bgCtx.fillStyle = g;
    bgCtx.fillRect(0,0,W,H);
  });

  const cycle = 900, phase = frame % cycle;
  if(phase < 260){
    const p = phase/260;
    const bx = -W*0.3 + p*W*1.6;
    bgCtx.save();
    bgCtx.translate(bx,0);
    bgCtx.transform(1,0,-0.18,1,0,0);
    const beam = bgCtx.createLinearGradient(-90,0,90,0);
    beam.addColorStop(0,'rgba(255,255,255,0)');
    beam.addColorStop(0.5,`rgba(${th.fog},0.09)`);
    beam.addColorStop(1,'rgba(255,255,255,0)');
    bgCtx.fillStyle = beam;
    bgCtx.fillRect(-90,-50,180,H+100);
    bgCtx.restore();
  }

  bgCtx.fillStyle = th.leaf;
  leaves.forEach(l => {
    l.y += l.speedY;
    l.x += l.speedX + Math.sin(frame*0.01+l.sway)*0.3;
    l.rot += l.rotSpeed;
    if(l.y > H+20){ l.y=-20; l.x=Math.random()*W; }
    if(l.x > W+20) l.x = -20;
    if(l.x < -20) l.x = W+20;
    bgCtx.save();
    bgCtx.translate(l.x,l.y);
    bgCtx.rotate(l.rot);
    bgCtx.globalAlpha = 0.5;
    bgCtx.beginPath();
    bgCtx.ellipse(0,0,l.size,l.size*0.42,0,0,Math.PI*2);
    bgCtx.fill();
    bgCtx.restore();
  });
  bgCtx.globalAlpha = 1;

  const vg = bgCtx.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.9);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,0.55)');
  bgCtx.fillStyle = vg;
  bgCtx.fillRect(0,0,W,H);

  requestAnimationFrame(animateBg);
}
resizeBg();
animateBg();

let currentLang = 'python';
let currentTab = 'console';
let runHistory = [];
let aiEntries = [];
let consoleLines = [];

const output = document.getElementById('output');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const execTimeEl = document.getElementById('execTime');
const fileMeta = document.getElementById('fileMeta');
const runBtn = document.getElementById('runBtn');

const editor = CodeMirror.fromTextArea(document.getElementById('code'), {
  mode: 'python',
  theme: 'default',
  lineNumbers: true,
  tabSize: 4,
  indentUnit: 4,
  matchBrackets: true,
  autoCloseBrackets: true,
  viewportMargin: Infinity
});
editor.setValue(LANGS.python.template);

/* ---------------- console rendering ---------------- */
function line(cls, text){ return `<div class="line ${cls}">${escapeHtml(text)}</div>`; }
function raw(cls, html){ return `<div class="line ${cls}">${html}</div>`; }
function escapeHtml(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function bootMessage(){
  consoleLines = [
    raw('hd','Cheetah Compile X'),
    raw('sep','────────────────────────────────────'),
    raw('ok','Runtime connected · Python · C · JavaScript · SQL'),
    raw('dim','Ctrl+Enter to run · Ctrl+K for AI review'),
    ''
  ];
  renderConsole();
}
function renderConsole(){
  if(currentTab==='console') output.innerHTML = consoleLines.join('');
}
function pushConsole(html){
  consoleLines.push(html);
  if(currentTab==='console'){ output.innerHTML = consoleLines.join(''); output.scrollTop = output.scrollHeight; }
}

/* ---------------- language switching ---------------- */
function setLanguage(lang){
  if(lang === currentLang) return;
  currentLang = lang;
  document.querySelectorAll('.lang-pill').forEach(p => p.classList.toggle('active', p.dataset.lang===lang));
  fileMeta.textContent = LANGS[lang].file;
  editor.setOption('mode', LANGS[lang].mode);
  if(!editor.getValue().trim() || confirmSwitchIsFresh()){
    editor.setValue(LANGS[lang].template);
  }
  editor.focus();
}
// Only auto-load template if the editor still holds another language's default template
function confirmSwitchIsFresh(){
  const val = editor.getValue().trim();
  return Object.values(LANGS).some(l => l.template.trim() === val);
}
function resetTemplate(){
  editor.setValue(LANGS[currentLang].template);
  editor.focus();
}

/* ---------------- tabs ---------------- */
function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab===tab));
  if(tab==='console'){
    output.innerHTML = consoleLines.join('');
  } else if(tab==='ai'){
    output.innerHTML = aiEntries.length ? aiEntries.join('') : line('dim','No AI review yet. Press Ctrl+K or click AI Review.');
  } else {
    output.innerHTML = runHistory.length
      ? runHistory.map((r,i) => raw('dim', `<span class="hd">[${i+1}]</span> ${escapeHtml(r.lang)} · ${r.time} · <span class="${r.success?'ok':'err'}">${r.success?'exit 0':'exit '+r.code}</span> · ${r.ms}ms`)).join('')
      : line('dim','No runs yet.');
  }
  output.scrollTop = output.scrollHeight;
}

function clearOutput(){
  bootMessage();
  aiEntries = [];
  runHistory = [];
  execTimeEl.textContent = '';
  setStatus('ready','Ready');
  switchTab('console');
}

function setStatus(state, text){
  statusDot.className = 'status-dot ' + state;
  statusText.textContent = text;
}

/* ---------------- run via Piston ---------------- */
async function runCode(){
  const code = editor.getValue();
  if(!code.trim()){
    pushConsole(line('warn','Write some code first.'));
    switchTab('console');
    return;
  }
  const cfg = LANGS[currentLang];
  runBtn.disabled = true;
  setStatus('running','Running…');
  switchTab('console');
  pushConsole(raw('sep','────────────────────────────────────'));
  pushConsole(raw('dim', `Run · ${cfg.file} · ${new Date().toLocaleTimeString()}`));

  const start = performance.now();
  try{
    const res = await fetch('https://emkc.org/api/v2/piston/execute', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        language: cfg.piston,
        version: '*',
        files: [{ name: cfg.file, content: code }]
      })
    });
    if(!res.ok) throw new Error('Execution service returned ' + res.status);
    const data = await res.json();
    const ms = (performance.now() - start).toFixed(0);
    execTimeEl.textContent = ms + 'ms';

    if(data.compile && data.compile.stderr && data.compile.stderr.trim()){
      pushConsole(raw('warn', `Compiler output:<br>${escapeHtml(data.compile.stderr.trim())}`));
    }

    const run = data.run || {};
    if(run.stdout && run.stdout.trim()) pushConsole(raw('ok', escapeHtml(run.stdout.replace(/\n+$/,''))));
    if(run.stderr && run.stderr.trim()) pushConsole(raw('err', escapeHtml(run.stderr.replace(/\n+$/,''))));

    const success = (run.code === 0 || run.code === null) && !(data.compile && data.compile.code);
    if(!run.stdout && !run.stderr) pushConsole(line('dim','(no output)'));
    pushConsole(raw(success?'ok':'err', `${success?'Finished':'Exited with code '+run.code} · ${ms}ms`));

    runHistory.unshift({lang: currentLang, time: new Date().toLocaleTimeString(), success, code: run.code, ms});
    setStatus(success?'ready':'error', success?'Ready':'Error');
  } catch(e){
    pushConsole(raw('err', `Network error reaching the execution service: ${escapeHtml(e.message)}`));
    setStatus('error','Error');
  } finally {
    runBtn.disabled = false;
  }
}

/* ---------------- AI review ---------------- */
async function aiReview(){
  const code = editor.getValue().trim();
  if(!code){
    pushConsole(line('warn','Need code to review.'));
    return;
  }
  setStatus('running','AI thinking…');
  switchTab('ai');
  output.innerHTML = line('thinking','Analyzing your code');

  try{
    const res = await fetch("/.netlify/functions/ai-review", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ code, language: currentLang })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || ('Server returned ' + res.status));
    const text = data.text || 'No response received.';
    const formatted = escapeHtml(text)
      .replace(/^VERDICT:/gm, '<span class="ai-verdict">VERDICT:</span>')
      .replace(/^BUGS:/gm, '<span class="ai-bugs">BUGS:</span>')
      .replace(/^PERFORMANCE:/gm, '<span class="ai-perf">PERFORMANCE:</span>')
      .replace(/^STYLE:/gm, '<span class="ai-style">STYLE:</span>')
      .replace(/^SUGGESTION:/gm, '<span class="ai-suggest">SUGGESTION:</span>')
      .replace(/\n/g,'<br>');

    const entry = raw('dim', `<span class="hd">Review</span> · ${LANGS[currentLang].file} · ${new Date().toLocaleTimeString()}<br><br>${formatted}<br><br><span class="sep">────────────────────────────────────</span>`);
    aiEntries.unshift(entry);
    output.innerHTML = aiEntries.join('');
    setStatus('ready','Ready');
  } catch(e){
    output.innerHTML = raw('err', `AI service error: ${escapeHtml(e.message)}`);
    setStatus('error','Error');
  }
}

/* ---------------- modal + shortcuts ---------------- */
function toggleModal(){ document.getElementById('modal').classList.toggle('open'); }

document.addEventListener('keydown', e => {
  if(e.ctrlKey && e.key === 'Enter'){ e.preventDefault(); runCode(); }
  if(e.ctrlKey && e.key === 'k'){ e.preventDefault(); aiReview(); }
  if(e.ctrlKey && e.key === 'l'){ e.preventDefault(); clearOutput(); }
  if(e.key === 'Escape'){ document.getElementById('modal').classList.remove('open'); editor.focus(); }
});

bootMessage();
editor.focus();
</script>
